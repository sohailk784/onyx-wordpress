 <rect x="37" y="81" width="5" height="12" rx="2" fill="#fff" fill-opacity=".7"/>
 <!-- cannula with bevelled point -->
 <path d="M48.4 99 H51.6 V166 L50 173 L48.4 168Z" fill="url(#steel)"/>
 <path d="M51.6 166 L50 173 L48.4 168 Z" fill="#eef1f4"/>
